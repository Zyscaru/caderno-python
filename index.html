<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Aprenda Python do zero com lições interativas, exercícios corrigidos na hora, desafios e projetos.">
<meta name="theme-color" content="#f5f8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121633" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno Python">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Caderno de Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: caderno quadriculado — trilha por módulos à esquerda; lição + editor/console lado a lado; no celular vira abas Lição / Código */
:root{
  --paper:#f5f8fc; --grid:#dfe7f2; --ink:#1d2754; --ink-soft:#4f5a82; --line:#c9d3e6;
  --card:#ffffff; --code-bg:#1b2140; --code-fg:#e8ecf8; --code-dim:#8a93b8; --key:#2a3260;
  --mark:#ffe156; --mark-ink:#1d2754; --accent:#2f4fd6; --chal:#7a3fd1;
  --ok:#1f8a4c; --ok-bg:#e3f5ea; --err:#c23a3a; --err-bg:#fbe7e7;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121633; --grid:#1b2148; --ink:#e7ebfa; --ink-soft:#a3abd0; --line:#2c3466;
  --card:#181d40; --code-bg:#0c0f24; --code-fg:#e8ecf8; --code-dim:#7d86ad; --key:#1e2550;
  --mark:#ffd93b; --mark-ink:#121633; --accent:#8ea4ff; --chal:#c6a3ff;
  --ok:#5fd394; --ok-bg:#163a2a; --err:#ff8a8a; --err-bg:#45202a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#121633; --grid:#1b2148; --ink:#e7ebfa; --ink-soft:#a3abd0; --line:#2c3466;
  --card:#181d40; --code-bg:#0c0f24; --code-fg:#e8ecf8; --code-dim:#7d86ad; --key:#1e2550;
  --mark:#ffd93b; --mark-ink:#121633; --accent:#8ea4ff; --chal:#c6a3ff;
  --ok:#5fd394; --ok-bg:#163a2a; --err:#ff8a8a; --err-bg:#45202a; color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}

/* ---------- trilha ---------- */
.trail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow:auto;padding:0 4px 8px 0;scrollbar-width:thin}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.55rem;line-height:1.05;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--ink-soft);letter-spacing:0;margin-top:6px}
.progress{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--ink-soft)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.map-btn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);border-radius:9px;padding:8px 12px;font-weight:700;font-size:.92rem}
.map-btn[aria-current="true"]{background:var(--ink);color:var(--card)}
.mods{display:flex;flex-direction:column;gap:4px}
.mods details{border-radius:10px}
.mods details[open]{background:color-mix(in srgb, var(--card) 70%, transparent)}
.mods summary{list-style:none;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.93rem}
.mods summary::-webkit-details-marker{display:none}
.mods summary:hover{background:var(--card)}
.mods summary .mnum{font-family:var(--f-code);font-size:.78rem;color:var(--ink-soft);text-align:center}
.mods summary .mcount{font-family:var(--f-code);font-size:.72rem;color:var(--ink-soft);font-weight:400;font-variant-numeric:tabular-nums}
.mods summary.full .mcount{color:var(--ok);font-weight:600}
.items{list-style:none;margin:0;padding:0 0 6px 0;display:flex;flex-direction:column;gap:1px}
.items button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;text-align:left;
  background:none;border:0;border-radius:8px;padding:5px 8px 5px 12px;font-size:.88rem;color:var(--ink);line-height:1.3}
.items button:hover{background:var(--card)}
.items button[aria-current="true"]{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-code);font-size:.7rem;
  border:1.5px solid var(--line);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.k-chal .ico{border-radius:5px;border-color:var(--chal);color:var(--chal)}
.k-quiz .ico{border-style:dashed}
.k-read .ico{border-radius:4px}
.done .ico{background:var(--ok);border-color:var(--ok);color:var(--card);border-style:solid}
.k-chal.done .ico{background:var(--chal);border-color:var(--chal)}
.trail-select{display:none}

/* ---------- abas (só celular) ---------- */
.tabs{display:none}

/* ---------- área principal ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start;min-width:0}
.main.solo{grid-template-columns:minmax(0,1fr)}
.main.solo .work{display:none}
.main.solo .lesson{max-width:900px}
.lesson{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:24px 26px;min-width:0}
.eyebrow{font-family:var(--f-code);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.eyebrow.c{color:var(--chal)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.1;letter-spacing:-.025em;margin:6px 0 16px;text-wrap:balance}
h1 span{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .1em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.lesson p{margin:0 0 14px;max-width:64ch}
.lesson code{font-family:var(--f-code);font-size:.88em;background:var(--grid);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:22px 0 10px}
.example{background:var(--code-bg);color:var(--code-fg);border-radius:10px;margin:0 0 16px;overflow:hidden}
.example pre{margin:0;padding:14px 16px;font-family:var(--f-code);font-size:.88rem;line-height:1.55;overflow-x:auto;white-space:pre}
.example .ex-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px 6px 16px;border-top:1px solid #ffffff1a;font-size:.78rem;color:var(--code-dim)}
.example .ex-bar span:last-child{display:flex;gap:6px}
.example button{background:#ffffff14;border:0;border-radius:6px;padding:6px 10px;color:var(--code-fg);font-size:.8rem}
.example button:hover{background:#ffffff26}
.task{background:var(--mark);color:var(--mark-ink);border-radius:10px;padding:14px 16px;margin-top:8px}
.task strong{font-family:var(--f-display);display:block;font-size:1rem;margin-bottom:4px}
.task p{margin:0}
.task code{background:#1d275418}
.go-code{display:none;margin-top:14px;width:100%}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:14px;border-top:1px dashed var(--line);flex-wrap:wrap}
.pager button{background:none;border:0;color:var(--ink-soft);font-size:.88rem;padding:6px 0;text-align:left;max-width:48%}
.pager button:last-child{text-align:right;margin-left:auto}
.pager button:hover{color:var(--ink)}
.pager b{display:block;color:var(--ink);font-weight:700}

/* mapa */
.map-head p{max-width:60ch}
.continue{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--card);border-radius:12px;padding:14px 16px;margin:6px 0 22px}
.continue small{display:block;opacity:.75;font-size:.8rem}
.continue b{font-family:var(--f-display);font-size:1.1rem}
.continue .btn{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.modcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:14px;color:var(--ink)}
.modcard:hover{border-color:var(--ink)}
.modcard .mn{font-family:var(--f-code);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.modcard b{font-family:var(--f-display);font-size:1.1rem;line-height:1.2}
.modcard span.s{font-size:.88rem;color:var(--ink-soft);flex:1}
.modcard .row{display:flex;align-items:center;gap:8px;font-family:var(--f-code);font-size:.75rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.modcard .row .bar{flex:1}
.modcard.full{border-color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;font-size:.82rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:6px}
.banner{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.banner b{font-family:var(--f-display);font-size:1.15rem;display:block}

/* quiz */
.qcard{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.qcard .qn{font-family:var(--f-code);font-size:.72rem;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.qcard .qq{font-weight:700;margin:4px 0 10px}
.qcard pre{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.86rem;overflow-x:auto;margin:0 0 10px}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;font-family:var(--f-code);font-size:.88rem;min-height:42px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--err);background:var(--err-bg);color:var(--err);text-decoration:line-through}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:.9rem;padding:8px 10px;border-radius:8px;background:var(--paper)}
.qsum{font-weight:700}

/* leitura */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:8px}
.sheet div{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.sheet b{display:block;padding:6px 10px;font-family:var(--f-display);font-size:.92rem;border-bottom:1px solid var(--line)}
.sheet pre{margin:0;padding:8px 10px;font-family:var(--f-code);font-size:.8rem;line-height:1.5;overflow-x:auto}
.read-done{margin-top:20px}

/* ---------- editor ---------- */
.work{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px;min-width:0}
.editor{background:var(--code-bg);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px -18px #0b0f2a}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid #ffffff14;color:var(--code-dim);font-family:var(--f-code);font-size:.78rem}
.ed-body{display:grid;grid-template-columns:42px 1fr;min-height:250px;max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch}
.gutter{padding:14px 8px 14px 0;text-align:right;font-family:var(--f-code);font-size:.92rem;line-height:1.6;color:#5a638c;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
#code{background:transparent;color:var(--code-fg);border:0;resize:none;outline:none;padding:14px 14px 14px 10px;font-family:var(--f-code);font-size:.92rem;line-height:1.6;
  white-space:pre;overflow:hidden;tab-size:4;caret-color:var(--mark);min-height:250px;width:100%}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid #ffffff14;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:8px;background:var(--key);color:var(--code-fg);font-family:var(--f-code);font-size:1rem}
.keys button.wide{font-size:.82rem}
.keys button:active{background:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:9px;padding:9px 16px;font-weight:700;font-size:.92rem;min-height:42px}
.btn:hover{background:var(--grid)}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.primary:hover{opacity:.9}
.btn.check{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);font-weight:400}
.btn:disabled{opacity:.5;cursor:wait}
.kbd{font-family:var(--f-code);font-size:.72rem;opacity:.75;margin-left:4px}
.console{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.con-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 14px;border-bottom:1px solid var(--line);font-family:var(--f-code);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
#out{margin:0;padding:12px 14px;min-height:110px;max-height:32vh;overflow:auto;font-family:var(--f-code);font-size:.9rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#out .muted{color:var(--ink-soft)}
#out .err{color:var(--err)}
#out .in{color:var(--accent);font-weight:600}
.inrow{display:flex;gap:6px;margin-top:4px}
.inrow input{flex:1;min-width:0;font-family:var(--f-code);font-size:16px;padding:8px;border:1.5px solid var(--accent);border-radius:6px;background:var(--paper);color:var(--ink)}
.feedback{border-radius:12px;padding:12px 14px;font-size:.93rem;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err);border:1.5px solid var(--err)}
.feedback b{font-family:var(--f-display)}
.feedback code{font-family:var(--f-code)}
.feedback .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.feedback .btn{font-size:.85rem;padding:6px 12px}
.hint{color:var(--ink);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:.9rem;white-space:pre-wrap}
.solution{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.85rem;white-space:pre;overflow-x:auto;margin:0}
.loading{font-size:.82rem;color:var(--ink-soft)}

@media (max-width:1080px){.main{grid-template-columns:minmax(0,1fr)}.work{position:static}}
@media (max-width:760px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
  .wrap{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:14px 32px}
  .trail{position:static;max-height:none;overflow:visible;gap:10px;padding:0}
  .brand{font-size:1.35rem}
  .brand small,.mods{display:none}
  .nav-row{display:grid;grid-template-columns:auto 1fr;gap:8px}
  .trail-select{display:block;width:100%;min-width:0;font:inherit;font-size:16px;padding:9px;border-radius:9px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
  .has-editor .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:6px 0;margin-bottom:6px}
  .tabs button{border:1.5px solid var(--ink);background:var(--card);border-radius:9px;padding:10px;font-weight:700}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
  .main[data-view="lesson"] .work{display:none}
  .main[data-view="code"]:not(.solo) .lesson{display:none}
  .go-code{display:block}
  .lesson{padding:20px 16px}
  .ed-body{max-height:none;min-height:200px}
  #code{font-size:16px;min-height:200px}
  .gutter{font-size:16px}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .actions .ghost{grid-column:1/-1}
  .kbd{display:none}
  #out{max-height:none}
}
@media (pointer:fine) and (min-width:761px){.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <aside class="trail">
    <div class="brand">Caderno de Python<small>Do primeiro print aos seus próprios projetos.</small></div>
    <div class="progress"><span id="progText">0% do curso</span><div class="bar"><i id="progBar"></i></div></div>
    <div class="nav-row">
      <button class="map-btn" id="mapBtn">▦ Mapa do curso</button>
      <label for="lessonSelect" hidden>Escolher etapa</label>
      <select class="trail-select" id="lessonSelect"></select>
    </div>
    <nav class="mods" id="mods" aria-label="Módulos do curso"></nav>
  </aside>

  <div id="area">
    <div class="tabs" role="tablist" aria-label="Alternar entre lição e código">
      <button role="tab" id="tabLesson" aria-selected="true">Lição</button>
      <button role="tab" id="tabCode" aria-selected="false">Código</button>
    </div>
    <div class="main" id="main" data-view="lesson">
      <article class="lesson" id="lesson" aria-live="polite"></article>

      <section class="work" aria-label="Área de prática">
        <div class="editor">
          <div class="ed-head"><span id="fname">exercicio.py</span><span id="engine" class="loading">carregando Python…</span></div>
          <div class="ed-body"><div class="gutter" id="gutter">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Editor de código"></textarea></div>
          <div class="keys" id="keys" aria-label="Símbolos"></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="run">▶ Executar<span class="kbd">Ctrl+Enter</span></button>
          <button class="btn check" id="check">Corrigir</button>
          <button class="btn ghost" id="reset">Recomeçar código</button>
        </div>
        <div id="feedback"></div>
        <div class="console" id="console">
          <div class="con-head"><span>Saída</span><button class="btn ghost" id="clear" style="min-height:32px;padding:2px 8px;font-size:.75rem">limpar</button></div>
          <pre id="out"><span class="muted">O resultado do seu código aparece aqui.</span></pre>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
/* Currículo do Caderno de Python — 10 módulos */
const MODULES = [
/* ============================================================ 1 */
{ id:"m1", title:"Primeiros passos", summary:"Mostrar coisas na tela, guardar valores, fazer contas e conversar com o usuário.",
items:[
{ kind:"lesson", id:"ola", title:"Olá, mundo", eyebrow:"O primeiro comando",
  body:`<p>Um programa é uma lista de instruções que o computador segue de cima para baixo. A instrução mais simples do Python é <code>print()</code>: ela mostra na tela o que estiver dentro dos parênteses.</p>
<p>Textos ficam entre aspas. Sem aspas, o Python acha que é um comando e reclama.</p>`,
  examples:[`print("Oi! Eu sou um programa.")
print("Cada print vira uma linha.")`],

`,

{ kind:"lesson", id:"comentarios", title:"Comentários e erros", eyebrow:"Lendo o que o Python diz",
  body:`<p>Tudo que vem depois de <code>#</code> numa linha é um <em>comentário</em>: o Python ignora. Comentários servem para você (e outras pessoas) entenderem o código depois.</p>
<p>Errar faz parte. Quando algo dá errado, o Python mostra uma mensagem com o <strong>tipo do erro</strong> e o <strong>número da linha</strong>. Ler essa mensagem com calma resolve a maioria dos problemas. Os mais comuns no começo são <code>SyntaxError</code> (escrita errada, como parêntese sem fechar) e <code>NameError</code> (um nome que o Python não conhece, muitas vezes um texto sem aspas).</p>`,
  examples:[`# Isto é um comentário, o Python pula esta linha
print("Esta linha roda")  # comentário no fim da linha também vale`,
`print("Vai dar erro aqui:")
print(Ola)`],
  task:`O programa no editor tem dois erros. Corrija para ele mostrar <code>Bom dia</code> e <code>Tudo bem?</code> em duas linhas, e acrescente um comentário explicando o que o programa faz.`,
  starter:`print("Bom dia"
print(Tudo bem?)
`,
  hint:`A primeira linha está sem o parêntese de fechar. Na segunda, faltam aspas em volta do texto. O comentário começa com #.`,
  solution:`# Mostra uma saudação
print("Bom dia")
print("Tudo bem?")`,
  require:[{re:/#/, msg:"Acrescente um comentário começando com #."}],
  tests:[{expect:`Bom dia
Tudo bem?`}] },

{ kind:"lesson", id:"variaveis", title:"Variáveis", eyebrow:"Guardando informações",
  body:`<p>Uma variável é uma caixinha com nome onde você guarda um valor para usar depois. O sinal <code>=</code> não significa "igual" aqui: significa <em>guarde isto aqui</em>.</p>
<p>Nomes de variáveis usam letras minúsculas, números e <code>_</code>, sem espaços e sem acento (<code>nome_completo</code>, <code>idade2</code>). Para juntar valores dentro do <code>print</code>, separe com vírgula: o Python coloca um espaço entre eles.</p>`,
  examples:[`nome = "Ana"
cidade = "Santos"
print("Meu nome é", nome)
print(nome, "mora em", cidade)
cidade = "Recife"   # o valor pode mudar
print(nome, "agora mora em", cidade)`],
  task:`Crie uma variável <code>fruta</code> com o valor <code>"manga"</code> e use-a para mostrar: <code>Eu gosto de manga</code>`,
  starter:`# Crie a variável fruta

# Mostre a frase usando a variável
`,
  hint:`Primeiro: fruta = "manga". Depois: print("Eu gosto de", fruta)`,
  solution:`fruta = "manga"
print("Eu gosto de", fruta)`,
  require:[{re:/fruta\s*=/, msg:"Crie a variável com fruta = ..."},{re:/print\([^)]*fruta/, msg:"Use a variável fruta dentro do print, em vez de escrever a palavra direto."}],
  tests:[{expect:"Eu gosto de manga"}] },

{ kind:"lesson", id:"numeros", title:"Números e contas", eyebrow:"Python como calculadora",
  body:`<p>Números não levam aspas. Existem dois tipos principais: inteiros (<code>int</code>, como <code>7</code>) e decimais (<code>float</code>, como <code>7.5</code>, com <strong>ponto</strong> no lugar da vírgula).</p>
<p>As contas usam <code>+</code>, <code>-</code>, <code>*</code> (vezes) e <code>/</code> (dividir). Há também <code>//</code> (divisão inteira), <code>%</code> (resto da divisão) e <code>**</code> (potência). Repare que <code>"2" + "2"</code> dá <code>22</code>: com aspas é texto, não número.</p>`,
  examples:[`print(10 + 5)
print(10 / 4)
print(10 // 4)
print(10 % 4)
print(2 ** 3)`, `preco = 12
quantidade = 3
total = preco * quantidade
print("Total:", total)`],
  task:`Um livro custa 35 reais. Guarde o preço em <code>preco</code> e a quantidade 4 em <code>quantidade</code>, calcule e mostre o total (só o número).`,
  starter:`preco = 35

`,
  hint:`Crie quantidade = 4 e depois print(preco * quantidade)`,
  solution:`preco = 35
quantidade = 4
print(preco * quantidade)`,
  require:[{re:/\*/, msg:"Use a multiplicação (*) para o Python calcular, em vez de escrever 140 direto."}],
  tests:[{expect:"140"}] },

{ kind:"lesson", id:"textos", title:"Trabalhando com textos", eyebrow:"Strings",
  body:`<p>Texto em programação se chama <em>string</em>. Strings têm ferramentas próprias: <code>.upper()</code> deixa tudo maiúsculo, <code>.lower()</code> minúsculo, e <code>len()</code> conta os caracteres.</p>
<p>O jeito mais prático de montar frases é a <em>f-string</em>: coloque um <code>f</code> antes das aspas e escreva variáveis (ou contas) entre chaves <code>{ }</code>.</p>`,
  examples:[`palavra = "café"
print(palavra.upper())
print(len(palavra))
print(f"A palavra {palavra} tem {len(palavra)} letras")
print(f"2 + 2 = {2 + 2}")`],
  task:`Com <code>linguagem = "python"</code>, mostre usando uma f-string: <code>PYTHON tem 6 letras</code>`,
  starter:`linguagem = "python"
`,
  hint:`print(f"{linguagem.upper()} tem {len(linguagem)} letras")`,
  solution:`linguagem = "python"
print(f"{linguagem.upper()} tem {len(linguagem)} letras")`,
  require:[{re:/upper\(\)/, msg:"Use .upper() para deixar maiúsculo."},{re:/len\(/, msg:"Use len() para contar as letras."}],
  tests:[{expect:"PYTHON tem 6 letras"}] },

{ kind:"lesson", id:"input", title:"Conversando com o usuário", eyebrow:"input()",
  body:`<p><code>input()</code> pausa o programa e espera a pessoa digitar algo. O que ela digitar sempre chega como <em>texto</em>.</p>
<p>Para fazer contas, converta para número com <code>int()</code> (inteiro) ou <code>float()</code> (decimal). E o caminho contrário também existe: <code>str()</code> transforma um número em texto.</p>`,

print(f"Prazer, {nome}!")`, `ano = int(input("Ano em que nasceu: "))

`,

  questions:[
  { q:`O que este código mostra?`, code:`print("2" + "3")`, options:["5","23","2 + 3","Dá erro"], answer:1,

{ id:"m2", title:"Decisões", summary:"Verdadeiro e falso, if/elif/else e como combinar condições.",
items:[
{ kind:"lesson", id:"bool", title:"Verdadeiro ou falso", eyebrow:"Booleanos",
  body:`<p>Toda comparação em Python dá uma de duas respostas: <code>True</code> (verdadeiro) ou <code>False</code> (falso). Esse tipo de valor se chama <em>booleano</em> (<code>bool</code>).</p>
<p>Os comparadores são: <code>==</code> igual, <code>!=</code> diferente, <code>&gt;</code> maior, <code>&lt;</code> menor, <code>&gt;=</code> maior ou igual e <code>&lt;=</code> menor ou igual. Atenção: <code>=</code> guarda um valor, <code>==</code> compara.</p>`,
  examples:[`print(5 > 3)
print(10 == 10)
print(10 != 10)
print("gato" == "Gato")   # maiúscula faz diferença
resposta = 7 >= 7
print(resposta, type(resposta))`],
  task:`Leia a idade de uma pessoa e mostre <code>True</code> se ela tiver 18 anos ou mais, ou <code>False</code> se não tiver. Use só uma comparação dentro do print.`,
  starter:`idade = int(input("Idade: "))
`,
  hint:`print(idade >= 18)`,
  solution:`idade = int(input("Idade: "))
print(idade >= 18)`,
  forbid:[{re:/\bif\b/, msg:"Desta vez, tente sem if: o próprio print(idade >= 18) já mostra True ou False."}],
  tests:[{inputs:["20"],expect:"True"},{inputs:["15"],expect:"False"},{inputs:["18"],expect:"True"}] },

{ kind:"lesson", id:"if", title:"Tomando decisões", eyebrow:"if, elif, else",
  body:`<p>Com <code>if</code> o programa escolhe um caminho. Se a condição for verdadeira, roda o bloco de baixo. <code>elif</code> testa outra condição e <code>else</code> pega todo o resto.</p>
<p>Dois detalhes importam: os dois-pontos <code>:</code> no fim da linha e o <strong>recuo de 4 espaços</strong> nas linhas de dentro. O recuo é o que diz ao Python o que pertence a cada bloco. O Python testa de cima para baixo e para no primeiro caminho verdadeiro.</p>`,
  examples:[`temperatura = 31
if temperatura >= 30:
    print("Dia de praia")
elif temperatura >= 20:
    print("Dia agradável")
else:
    print("Leve um casaco")
print("Esta linha roda sempre, está fora do if")`],
  task:`Leia uma nota (número inteiro). Mostre <code>Aprovado</code> se for 7 ou mais, <code>Recuperação</code> se for 5 ou 6, e <code>Reprovado</code> abaixo de 5.`,
  starter:`nota = int(input("Nota: "))
`,
  hint:`if nota >= 7: ... elif nota >= 5: ... else: ... (não esqueça os dois-pontos e o recuo)`,
  solution:`nota = int(input("Nota: "))
if nota >= 7:
    print("Aprovado")
elif nota >= 5:
    print("Recuperação")
else:
    print("Reprovado")`,
  tests:[{inputs:["8"],expect:"Aprovado"},{inputs:["7"],expect:"Aprovado"},{inputs:["5"],expect:"Recuperação"},{inputs:["3"],expect:"Reprovado"}] },

{ kind:"lesson", id:"logica", title:"E, ou, não", eyebrow:"and, or, not",
  body:`<p>Às vezes uma decisão depende de mais de uma condição. Para isso existem três palavras:</p>
<p><code>and</code> (e): verdadeiro só se <strong>as duas</strong> forem verdadeiras. <code>or</code> (ou): verdadeiro se <strong>pelo menos uma</strong> for. <code>not</code> (não): inverte, transforma True em False e vice-versa.</p>`,
  examples:[`idade = 16
com_responsavel = True
if idade >= 18 or com_responsavel:
    print("Pode entrar")

chovendo = False
tem_guarda_chuva = True
if not chovendo and tem_guarda_chuva:
    print("Nem precisa do guarda-chuva hoje")`],
  task:`Leia a idade e mostre <code>Meia</code> se a pessoa tiver menos de 12 anos <strong>ou</strong> 60 anos ou mais. Caso contrário, mostre <code>Inteira</code>.`,
  starter:`idade = int(input("Idade: "))
`,
  hint:`if idade < 12 or idade >= 60: print("Meia") else: print("Inteira")`,
  solution:`idade = int(input("Idade: "))
if idade < 12 or idade >= 60:
    print("Meia")
else:
    print("Inteira")`,
  require:[{re:/\bor\b/, msg:"Use or para juntar as duas condições em um só if."}],
  tests:[{inputs:["8"],expect:"Meia"},{inputs:["30"],expect:"Inteira"},{inputs:["60"],expect:"Meia"},{inputs:["12"],expect:"Inteira"}] },

`,

if numero % 2 == 0:

{ kind:"chal", id:"d-maior3", title:"O maior de três", level:"Médio",

{ kind:"quiz", id:"q2", title:"Revisão: decisões",
  questions:[
  { q:`O que este código mostra?`, code:`print(5 > 3 and 2 > 4)`, options:["True","False","5","Dá erro"], answer:1,
    why:`5 > 3 é True, mas 2 > 4 é False. Com and, as duas precisam ser verdadeiras.` },
  { q:`Qual símbolo compara se dois valores são iguais?`, options:["=","==","===",":="], answer:1,

  { q:`O que define quais linhas pertencem a um if?`, options:["Os parênteses","As chaves { }","O recuo (espaços no começo da linha)","O ponto e vírgula"], answer:2,

{ id:"m3", title:"Repetição", summary:"for, while, break e continue: fazer o computador repetir o trabalho por você.",
items:[
{ kind:"lesson", id:"for", title:"Repetindo com for", eyebrow:"Laços",
  body:`<p>O <code>for</code> repete um bloco para cada item de uma sequência. Com <code>range()</code> você gera sequências de números: <code>range(5)</code> vai de 0 a 4, <code>range(1, 6)</code> vai de 1 a 5 (o último número fica de fora) e <code>range(0, 10, 2)</code> pula de 2 em 2.</p>
<p>É assim que um programa faz em 2 linhas o que levaria 100 linhas escritas à mão.</p>`,
  examples:[`for cor in ["azul", "verde", "roxo"]:
    print("Eu gosto de", cor)`, `for n in range(1, 6):
    print(n, "ao quadrado é", n ** 2)`, `for letra in "Python":
    print(letra)`],
  task:`Mostre a tabuada do 7, de <code>7 x 1 = 7</code> até <code>7 x 10 = 70</code>, uma conta por linha.`,
  starter:`for i in range(1, 11):
    `,
  hint:`Dentro do for: print(f"7 x {i} = {7 * i}")`,
  solution:`for i in range(1, 11):
    print(f"7 x {i} = {7 * i}")`,
  require:[{re:/\bfor\b/, msg:"Use um for, em vez de escrever as 10 linhas à mão."}],
  tests:[{expect:Array.from({length:10},(_,i)=>`7 x ${i+1} = ${7*(i+1)}`).join("\n")}] },

{ kind:"lesson", id:"acumuladores", title:"Contadores e acumuladores", eyebrow:"Somando dentro do laço",
  body:`<p>Um padrão aparece em quase todo programa: criar uma variável <strong>antes</strong> do laço e atualizar ela <strong>dentro</strong> do laço.</p>
<p>Um <em>contador</em> soma 1 a cada vez (<code>conta += 1</code>). Um <em>acumulador</em> soma valores (<code>total += valor</code>). <code>+=</code> é um atalho: <code>total += 5</code> é o mesmo que <code>total = total + 5</code>.</p>`,
  examples:[`total = 0
for preco in [10, 25, 5]:
    total += preco
print("Total da compra:", total)`, `vogais = 0
for letra in "programação":
    if letra in "aeiouáãçõ":
        vogais += 1
print(vogais)`],
  task:`Use um <code>for</code> com um acumulador para somar todos os números de 1 a 100 e mostre o resultado.`,
  starter:`total = 0
`,
  hint:`for n in range(1, 101): total += n. Depois do laço, print(total).`,
  solution:`total = 0
for n in range(1, 101):
    total += n
print(total)`,
  forbid:[{re:/sum\s*\(/, msg:"Faça com um for e um acumulador, sem sum()."}],
  require:[{re:/\bfor\b/, msg:"Use um for."}],
  tests:[{expect:"5050"}] },

{ kind:"lesson", id:"while", title:"Repetindo com while", eyebrow:"Enquanto for verdade",
  body:`<p>O <code>while</code> repete enquanto a condição for verdadeira. Use quando você não sabe de antemão quantas vezes vai repetir.</p>
<p>Cuidado: se a condição nunca ficar falsa, o laço não termina (o famoso <em>laço infinito</em>). Por isso quase sempre algo muda dentro dele, como <code>contador -= 1</code>.</p>`,
  examples:[`saldo = 100
meses = 0
while saldo < 200:
    saldo = saldo * 1.1
    meses += 1
print("Dobrou em", meses, "meses")`],
  task:`Faça uma contagem regressiva com <code>while</code>: mostre 5, 4, 3, 2, 1 (um por linha) e depois <code>Fogo!</code>`,
  starter:`contador = 5
`,
  hint:`while contador > 0: print(contador) e contador -= 1. Depois do laço (sem recuo), print("Fogo!")`,
  solution:`contador = 5
while contador > 0:
    print(contador)
    contador -= 1
print("Fogo!")`,
  require:[{re:/\bwhile\b/, msg:"Use um while nesta lição."}],
  tests:[{expect:`5
4
3
2
1
Fogo!`}] },

{ kind:"lesson", id:"break", title:"Saindo e pulando", eyebrow:"break e continue",
  body:`<p><code>break</code> interrompe o laço na hora e segue para a linha depois dele. <code>continue</code> pula o resto da repetição atual e vai direto para a próxima.</p>
<p>Um padrão muito usado é <code>while True:</code>, um laço que repetiria para sempre, combinado com um <code>break</code> quando chega a hora de parar.</p>`,
  examples:[`for n in range(1, 11):
    if n % 2 == 0:
        continue      # pula os pares
    print(n)`, `while True:
    resposta = input("Digite sair para parar: ")
    if resposta == "sair":
        break
    print("Você digitou", resposta)
print("Fim!")`],
  task:`Leia números um por vez e vá somando. Quando a pessoa digitar <code>0</code>, pare e mostre a soma.`,
  starter:`total = 0
while True:
    numero = int(input("Número (0 para parar): "))
`,
  hint:`Dentro do laço: if numero == 0: break. Senão, total += numero. Depois do laço, print(total).`,
  solution:`total = 0
while True:
    numero = int(input("Número (0 para parar): "))
    if numero == 0:
        break
    total += numero
print(total)`,
  require:[{re:/\bbreak\b/, msg:"Use break para sair do laço."}],
  tests:[{inputs:["5","3","2","0"],expect:"10"},{inputs:["0"],expect:"0"},{inputs:["-4","10","0"],expect:"6"}] },

{ kind:"lesson", id:"aninhados", title:"Laços dentro de laços", eyebrow:"Laços aninhados",
  body:`<p>Um laço pode ter outro laço dentro. Para cada volta do laço de fora, o de dentro roda inteiro. É assim que se percorrem tabelas, grades e tabuleiros.</p>
<p>Um detalhe útil: <code>print(x, end=" ")</code> mostra o valor <strong>sem pular de linha</strong>. Um <code>print()</code> vazio pula a linha.</p>`,
  examples:[`for linha in range(1, 4):
    for coluna in range(1, 5):
        print("*", end=" ")
    print()`],
  task:`Mostre a tabela de multiplicação de 1 a 3 em formato de grade: três linhas, cada uma com três resultados separados por espaço (<code>1 2 3</code>, depois <code>2 4 6</code>, depois <code>3 6 9</code>).`,
  starter:`for i in range(1, 4):
    `,
  hint:`Dentro do for de fora: for j in range(1, 4): print(i * j, end=" "). Depois do de dentro, print().`,
  solution:`for i in range(1, 4):
    for j in range(1, 4):
        print(i * j, end=" ")
    print()`,
  tests:[{expect:`1 2 3
2 4 6
3 6 9`}] },

{ kind:"chal", id:"d-fizz", title:"FizzBuzz", level:"Médio",
  task:`Mostre os números de 1 a 15, um por linha. Mas: múltiplos de 3 viram <code>Fizz</code>, múltiplos de 5 viram <code>Buzz</code> e múltiplos dos dois viram <code>FizzBuzz</code>.`,
  tip:`Teste primeiro o caso dos dois (múltiplo de 15), senão ele nunca é alcançado.`,
  starter:`for n in range(1, 16):
    `,
  hint:`if n % 15 == 0: ... elif n % 3 == 0: ... elif n % 5 == 0: ... else: print(n)`,
  solution:`for n in range(1, 16):
    if n % 15 == 0:
        print("FizzBuzz")
    elif n % 3 == 0:
        print("Fizz")
    elif n % 5 == 0:
        print("Buzz")
    else:
        print(n)`,
  tests:[{expect:`1
2
Fizz
4
Buzz
Fizz
7
8
Fizz
Buzz
11
Fizz
13
14
FizzBuzz`}] },

{ kind:"chal", id:"d-primo", title:"Número primo", level:"Difícil",
  task:`Leia um número inteiro e mostre <code>Primo</code> ou <code>Não é primo</code>. Primo é o número maior que 1 que só é divisível por 1 e por ele mesmo.`,
  tip:`Teste os divisores de 2 até o número menos 1. Se algum dividir sem resto, não é primo. Uma variável <code>True</code>/<code>False</code> ajuda a lembrar o que você descobriu.`,
  starter:`n = int(input("Número: "))
`,
  hint:`primo = n > 1; for d in range(2, n): if n % d == 0: primo = False; break. Depois decida o que mostrar.`,
  solution:`n = int(input("Número: "))
primo = n > 1
for d in range(2, n):
    if n % d == 0:
        primo = False
        break
if primo:
    print("Primo")
else:
    print("Não é primo")`,
  tests:[{inputs:["7"],expect:"Primo"},{inputs:["9"],expect:"Não é primo"},{inputs:["2"],expect:"Primo"},{inputs:["1"],expect:"Não é primo"},{inputs:["97"],expect:"Primo"}] },

{ kind:"quiz", id:"q3", title:"Revisão: repetição",
  questions:[
  { q:`Quantas vezes o print roda?`, code:`for i in range(3):
    print(i)`, options:["2","3","4","Infinitas"], answer:1,
    why:`range(3) gera 0, 1 e 2: três valores.` },
  { q:`Quais números range(2, 10, 3) gera?`, options:["2, 5, 8","2, 5, 8, 11","3, 6, 9","2, 3, 4 … 9"], answer:0,
    why:`Começa em 2, pula de 3 em 3 e para antes de 10.` },
  { q:`O que o break faz?`, options:["Pula para a próxima repetição","Sai do laço na hora","Encerra o programa inteiro","Reinicia o laço"], answer:1,
    why:`break sai do laço. Quem pula para a próxima repetição é o continue.` },
  { q:`Qual o principal cuidado ao usar while?`, options:["Ele só aceita números","Ele não aceita if dentro","Garantir que a condição um dia fique falsa","Ele sempre roda só uma vez"], answer:2,
    why:`Se nada muda a condição, o laço nunca termina.` },
  ]},
]},

/* ============================================================ 4 */
{ id:"m4", title:"Coleções", summary:"Listas, tuplas, dicionários e conjuntos: guardar e organizar muitos valores.",
items:[
{ kind:"lesson", id:"listas", title:"Listas", eyebrow:"Vários valores juntos",
  body:`<p>Uma lista guarda vários valores em ordem, entre colchetes. Cada item tem uma posição (<em>índice</em>) começando do <strong>zero</strong>: <code>lista[0]</code> é o primeiro e <code>lista[-1]</code> é o último.</p>
<p><code>.append()</code> adiciona um item no fim, <code>len()</code> diz quantos itens existem e você pode trocar um item com <code>lista[1] = "novo"</code>.</p>`,
  examples:[`cores = ["azul", "verde", "roxo"]
print(cores[0])
cores.append("amarelo")
cores[1] = "laranja"
print(cores)
print(len(cores), "cores")`],
  task:`Adicione <code>"frutas"</code> à lista de compras. Depois mostre, em linhas separadas, quantos itens a lista tem e qual é o último item.`,
  starter:`compras = ["arroz", "leite", "ovos"]
`,
  hint:`compras.append("frutas"), depois print(len(compras)) e print(compras[-1])`,
  solution:`compras = ["arroz", "leite", "ovos"]
compras.append("frutas")
print(len(compras))
print(compras[-1])`,
  require:[{re:/append\(/, msg:"Use .append() para adicionar o item."}],
  tests:[{expect:`4
frutas`}] },

{ kind:"lesson", id:"listas2", title:"Ferramentas de listas", eyebrow:"Ordenar, fatiar, buscar",
  body:`<p>Listas vêm com muitas ferramentas. <code>max()</code>, <code>min()</code> e <code>sum()</code> trabalham com números. <code>sorted(lista)</code> devolve uma cópia ordenada e <code>.sort()</code> ordena a própria lista. <code>.remove(x)</code> tira um item e <code>x in lista</code> diz se ele está lá.</p>
<p>Com <em>fatias</em> você pega pedaços: <code>lista[0:3]</code> (ou só <code>lista[:3]</code>) pega os três primeiros, e <code>lista[-2:]</code> os dois últimos.</p>`,
  examples:[`numeros = [4, 1, 9, 7]
print(max(numeros), min(numeros), sum(numeros))
print(sorted(numeros))
print(numeros[:2], numeros[-2:])
print(9 in numeros, 5 in numeros)
numeros.remove(9)
print(numeros)`],
  task:`Com a lista de notas, mostre em linhas separadas: a maior nota, a menor nota, a lista ordenada e as três menores notas.`,
  starter:`notas = [7, 5, 9, 6, 10]
`,
  hint:`print(max(notas)), print(min(notas)), ordenadas = sorted(notas), print(ordenadas), print(ordenadas[:3])`,
  solution:`notas = [7, 5, 9, 6, 10]
print(max(notas))
print(min(notas))
ordenadas = sorted(notas)
print(ordenadas)
print(ordenadas[:3])`,
  tests:[{expect:`10
5
[5, 6, 7, 9, 10]
[5, 6, 7]`}] },

{ kind:"lesson", id:"percorrer", title:"Percorrendo listas", eyebrow:"for + listas",
  body:`<p>O <code>for</code> e as listas foram feitos um para o outro. Com eles você analisa cada item: conta os que obedecem a uma regra, soma, procura o maior.</p>
<p>Se precisar da posição junto com o item, use <code>enumerate()</code>.</p>`,
  examples:[`nomes = ["Ana", "Leo", "Bia"]
for posicao, nome in enumerate(nomes):
    print(posicao, nome)`, `temperaturas = [28, 31, 25, 33]
quentes = 0
for t in temperaturas:
    if t > 30:
        quentes += 1
print(quentes, "dias quentes")`],
  task:`Percorra a lista de preços com <code>for</code>. Mostre quantos produtos custam mais de 10 reais e, na linha seguinte, a soma de todos os preços.`,
  starter:`precos = [12.5, 8, 30, 4.5]
caros = 0
total = 0
`,
  hint:`for p in precos: total += p; if p > 10: caros += 1. Depois print(caros) e print(total).`,
  solution:`precos = [12.5, 8, 30, 4.5]
caros = 0
total = 0
for p in precos:
    total += p
    if p > 10:
        caros += 1
print(caros)
print(total)`,
  require:[{re:/\bfor\b/, msg:"Use um for para percorrer a lista."}],
  tests:[{expect:`2
55.0`}] },

{ kind:"lesson", id:"tuplas", title:"Tuplas", eyebrow:"Listas que não mudam",
  body:`<p>Uma tupla é parecida com uma lista, mas usa parênteses e <strong>não pode ser alterada</strong> depois de criada. Serve para valores que andam juntos, como coordenadas ou uma data.</p>
<p>O truque mais útil é o <em>desempacotamento</em>: <code>x, y = ponto</code> coloca cada valor numa variável. Ele também permite trocar duas variáveis de uma vez: <code>a, b = b, a</code>.</p>`,
  examples:[`data = (25, 12, 2026)
dia, mes, ano = data
print(f"{dia}/{mes}/{ano}")
print(data[0])`],
  task:`Desempacote <code>ponto</code> nas variáveis <code>x</code> e <code>y</code> e mostre <code>x=3 y=7</code>. Depois troque os valores de <code>a</code> e <code>b</code> em uma linha só e mostre <code>a</code> e <code>b</code>.`,
  starter:`ponto = (3, 7)

a = 1
b = 2
`,
  hint:`x, y = ponto e print(f"x={x} y={y}"). Para trocar: a, b = b, a e print(a, b).`,
  solution:`ponto = (3, 7)
x, y = ponto
print(f"x={x} y={y}")
a = 1
b = 2
a, b = b, a
print(a, b)`,
  require:[{re:/x\s*,\s*y\s*=\s*ponto/, msg:"Desempacote com x, y = ponto."},{re:/a\s*,\s*b\s*=\s*b\s*,\s*a/, msg:"Troque com a, b = b, a."}],
  tests:[{expect:`x=3 y=7
2 1`}] },

{ kind:"lesson", id:"dicionarios", title:"Dicionários", eyebrow:"Pares de chave e valor",
  body:`<p>Uma lista guarda itens por posição. Um <em>dicionário</em> guarda itens por <strong>nome</strong>: cada valor tem uma chave, como numa agenda em que você procura pelo nome e encontra o telefone.</p>
<p>Ele usa chaves <code>{ }</code> e dois-pontos entre chave e valor. Para ler ou mudar um valor, use colchetes com a chave: <code>estoque["caneta"]</code>. Atribuir a uma chave nova cria o item.</p>`,
  examples:[`agenda = {"Ana": "9999-1111", "Leo": "9888-2222"}
print(agenda["Ana"])
agenda["Bia"] = "9777-3333"
print(len(agenda), "contatos")
print(agenda)`],
  task:`No estoque abaixo: mude a quantidade de <code>"caneta"</code> para 8 e adicione <code>"lapis"</code> com 20. Depois mostre, um por linha: a quantidade de caneta, a de lapis e quantos itens o estoque tem.`,
  starter:`estoque = {"caneta": 10, "caderno": 5}

`,
  hint:`estoque["caneta"] = 8 e estoque["lapis"] = 20. Depois três prints: estoque["caneta"], estoque["lapis"] e len(estoque).`,
  solution:`estoque = {"caneta": 10, "caderno": 5}
estoque["caneta"] = 8
estoque["lapis"] = 20
print(estoque["caneta"])
print(estoque["lapis"])
print(len(estoque))`,
  require:[{re:/estoque\[\s*["']lapis["']\s*\]\s*=/, msg:"Adicione o lapis com estoque[\"lapis\"] = 20."}],
  tests:[{expect:`8
20
3`}] },

{ kind:"lesson", id:"dicionarios2", title:"Percorrendo dicionários", eyebrow:".items(), .get() e in",
  body:`<p><code>for chave, valor in dicio.items():</code> percorre todos os pares. <code>chave in dicio</code> diz se a chave existe.</p>
<p>Ler uma chave que não existe dá erro (<code>KeyError</code>). Para evitar, use <code>dicio.get(chave, padrão)</code>, que devolve o padrão quando a chave não está lá.</p>`,
  examples:[`precos = {"pao": 1.5, "leite": 4.0}
for produto, preco in precos.items():
    print(produto, "custa", preco)
print("cafe" in precos)
print(precos.get("cafe", 0))`],
  task:`Calcule o total do carrinho usando o dicionário de preços: percorra o carrinho, some o preço de cada item e mostre o total.`,
  starter:`precos = {"pao": 1.5, "leite": 4.0, "cafe": 12.0}
carrinho = ["pao", "pao", "leite", "cafe"]
total = 0
`,
  hint:`for item in carrinho: total += precos[item]. Depois print(total).`,
  solution:`precos = {"pao": 1.5, "leite": 4.0, "cafe": 12.0}
carrinho = ["pao", "pao", "leite", "cafe"]
total = 0
for item in carrinho:
    total += precos[item]
print(total)`,
  require:[{re:/precos\[|precos\.get/, msg:"Busque cada preço no dicionário precos."}],
  tests:[{expect:"19.0"}] },

{ kind:"lesson", id:"conjuntos", title:"Conjuntos", eyebrow:"set: itens sem repetição",
  body:`<p>Um <em>conjunto</em> (<code>set</code>) guarda itens <strong>sem repetição</strong> e sem ordem. Transformar uma lista em conjunto é o jeito mais rápido de tirar duplicados.</p>
<p>Conjuntos também fazem operações de comparação: <code>a & b</code> (o que está nos dois), <code>a | b</code> (tudo junto) e <code>a - b</code> (o que está em a mas não em b). Como não têm ordem, use <code>sorted()</code> para mostrar organizado.</p>`,
  examples:[`numeros = [3, 1, 3, 2, 1]
print(sorted(set(numeros)))
python = {"Ana", "Leo", "Bia"}
excel = {"Leo", "Caio"}
print(sorted(python & excel))
print(sorted(python | excel))`],
  task:`A lista registra cada visita ao site. Mostre quantos visitantes <strong>diferentes</strong> houve e, na linha seguinte, os nomes deles em ordem alfabética.`,
  starter:`visitas = ["ana", "leo", "ana", "bia", "leo", "ana"]
`,
  hint:`unicos = set(visitas). print(len(unicos)) e print(sorted(unicos))`,
  solution:`visitas = ["ana", "leo", "ana", "bia", "leo", "ana"]
unicos = set(visitas)
print(len(unicos))
print(sorted(unicos))`,
  require:[{re:/set\(/, msg:"Use set() para tirar os repetidos."}],
  tests:[{expect:`3
['ana', 'bia', 'leo']`}] },

{ kind:"lesson", id:"compreensao", title:"Listas em uma linha", eyebrow:"List comprehension",
  body:`<p>Criar uma lista nova a partir de outra é tão comum que o Python tem um atalho: <code>[expressão for item in lista]</code>. Dá para filtrar no mesmo lugar: <code>[x for x in lista if condição]</code>.</p>
<p>É o mesmo que um <code>for</code> com <code>append</code>, só que mais curto.</p>`,
  examples:[`precos = [10, 20, 30]
com_desconto = [p * 0.9 for p in precos]
print(com_desconto)

nomes = ["ana", "bruno", "carla"]
print([n.upper() for n in nomes if len(n) > 3])`],
  task:`Usando list comprehension, crie e mostre: a lista dos quadrados de 1 a 5, e a lista só com os números pares de <code>numeros</code>.`,
  starter:`numeros = [3, 8, 1, 6, 10, 7]
`,
  hint:`quadrados = [n ** 2 for n in range(1, 6)] e pares = [n for n in numeros if n % 2 == 0]`,
  solution:`numeros = [3, 8, 1, 6, 10, 7]
quadrados = [n ** 2 for n in range(1, 6)]
pares = [n for n in numeros if n % 2 == 0]
print(quadrados)
print(pares)`,
  require:[{re:/\[[^\]\n]*\bfor\b/, msg:"Use a forma [... for ... in ...]."}],
  tests:[{expect:`[1, 4, 9, 16, 25]
[8, 6, 10]`}] },

{ kind:"chal", id:"d-acima", title:"Notas acima da média", level:"Médio",
  task:`Calcule a média das notas e mostre-a. Na linha seguinte, mostre uma lista com as notas que ficaram acima da média.`,
  tip:`Média é a soma dividida pela quantidade. Depois, uma list comprehension com <code>if</code> filtra as notas.`,
  starter:`notas = [6, 8, 5, 9, 7]
`,
  hint:`media = sum(notas) / len(notas); acima = [n for n in notas if n > media]`,
  solution:`notas = [6, 8, 5, 9, 7]
media = sum(notas) / len(notas)
acima = [n for n in notas if n > media]
print(media)
print(acima)`,
  tests:[{expect:`7.0
[8, 9]`}] },

{ kind:"quiz", id:"q4", title:"Revisão: coleções",
  questions:[
  { q:`O que este código mostra?`, code:`letras = ["a", "b", "c"]
print(letras[1])`, options:["a","b","c","Dá erro"], answer:1,
    why:`As posições começam do 0, então a posição 1 é o segundo item.` },
  { q:`Qual estrutura não guarda itens repetidos?`, options:["Lista","Tupla","Dicionário (valores)","Conjunto (set)"], answer:3,
    why:`Um set mantém cada item uma vez só.` },
  { q:`O que este código mostra?`, code:`d = {"x": 1}
print(d.get("y", 0))`, options:["1","0","None","KeyError"], answer:1,
    why:`A chave "y" não existe, então .get devolve o valor padrão, 0.` },
  { q:`O que este código mostra?`, code:`print([n * 2 for n in range(3)])`, options:["[2, 4, 6]","[0, 2, 4]","[0, 1, 2]","[0, 2, 4, 6]"], answer:1,
    why:`range(3) gera 0, 1, 2 e cada um é multiplicado por 2.` },
  { q:`Qual a diferença principal entre lista e tupla?`, options:["Tupla não pode ser alterada","Lista não aceita números","Tupla não tem posições","Não há diferença"], answer:0,
    why:`Tuplas são imutáveis: depois de criadas, não dá para trocar, adicionar ou remover itens.` },
  ]},
]},

/* ============================================================ 5 */
{ id:"m5", title:"Funções", summary:"Criar seus próprios comandos, devolver resultados e organizar programas maiores.",
items:[
{ kind:"lesson", id:"funcoes", title:"Funções", eyebrow:"Seus próprios comandos",
  body:`<p>Uma função é um pedaço de código com nome, que você cria uma vez e usa quantas vezes quiser. Ela começa com <code>def</code>, recebe valores entre parênteses (os <em>parâmetros</em>) e devolve um resultado com <code>return</code>.</p>
<p><code>return</code> é diferente de <code>print</code>: o print só mostra; o return entrega o valor para quem chamou a função, que pode guardar, somar ou mostrar.</p>`,
  examples:[`def saudacao(nome):
    return f"Bom dia, {nome}!"

print(saudacao("Bia"))
mensagem = saudacao("Leo")
print(mensagem.upper())`],
  task:`Crie a função <code>dobro(n)</code> que <strong>devolve</strong> (com return) o dobro do número recebido. O corretor vai testar com vários números.`,
  starter:`def dobro(n):
    `,
  hint:`def dobro(n):
    return n * 2`,
  solution:`def dobro(n):
    return n * 2

print(dobro(5))`,
  require:[{re:/return/, msg:"A função precisa usar return."}],
  tests:[{suffix:`print(dobro(4))
print(dobro(-3))
print(dobro(0))`, expect:`8
-6
0`}] },

{ kind:"lesson", id:"parametros", title:"Parâmetros", eyebrow:"Valores padrão e nomeados",
  body:`<p>Uma função pode receber vários parâmetros, separados por vírgula. Um parâmetro pode ter um <em>valor padrão</em>, usado quando ninguém informa: <code>def f(x, vezes=2)</code>.</p>
<p>Na hora de chamar, você pode dizer o nome do parâmetro (<em>argumento nomeado</em>). Assim a ordem deixa de importar e o código fica mais claro.</p>`,
  examples:[`def preco_final(valor, desconto=0):
    return valor - valor * desconto / 100

print(preco_final(100))
print(preco_final(100, 15))
print(preco_final(desconto=50, valor=80))`],
  task:`Crie <code>saudacao(nome, cumprimento="Olá")</code> que devolve o cumprimento, uma vírgula e o nome com exclamação. Exemplo: <code>saudacao("Ana")</code> devolve <code>Olá, Ana!</code>.`,
  starter:`def saudacao(nome, cumprimento="Olá"):
    `,
  hint:`return f"{cumprimento}, {nome}!"`,
  solution:`def saudacao(nome, cumprimento="Olá"):
    return f"{cumprimento}, {nome}!"`,
  tests:[{suffix:`print(saudacao("Ana"))
print(saudacao("Leo", "Bom dia"))
print(saudacao(cumprimento="Oi", nome="Bia"))`, expect:`Olá, Ana!
Bom dia, Leo!
Oi, Bia!`}] },

{ kind:"lesson", id:"retorno", title:"Devolvendo vários valores", eyebrow:"return com tupla",
  body:`<p>Uma função pode devolver mais de um valor de uma vez: basta separar por vírgula no <code>return</code>. O Python junta tudo numa tupla.</p>
<p>Quem chama pode desempacotar direto em variáveis: <code>menor, maior = extremos(lista)</code>.</p>`,
  examples:[`def dividir(a, b):
    return a // b, a % b

quociente, resto = dividir(17, 5)
print(quociente, resto)
print(dividir(10, 3))`],
  task:`Crie <code>extremos(lista)</code> que devolve o menor e o maior número da lista, nessa ordem.`,
  starter:`def extremos(lista):
    `,
  hint:`return min(lista), max(lista)`,
  solution:`def extremos(lista):
    return min(lista), max(lista)`,
  tests:[{suffix:`print(extremos([3, 9, 1]))
a, b = extremos([5])
print(a, b)
menor, maior = extremos([-2, 8, 4])
print(menor, maior)`, expect:`(1, 9)
5 5
-2 8`}] },

{ kind:"lesson", id:"escopo", title:"Variáveis dentro de funções", eyebrow:"Escopo",
  body:`<p>Variáveis criadas dentro de uma função só existem <strong>lá dentro</strong> (são <em>locais</em>). Quando a função termina, elas somem. Isso é bom: cada função cuida das suas coisas sem bagunçar o resto do programa.</p>
<p>Por isso, a forma certa de uma função mudar um valor do programa é <strong>receber</strong> o valor por parâmetro e <strong>devolver</strong> o novo valor com return. Quem chamou guarda o resultado.</p>`,
  examples:[`def calcular():
    resultado = 42      # variável local
    return resultado

valor = calcular()
print(valor)
# print(resultado) daria NameError: ela não existe aqui fora`],
  task:`Crie <code>adicionar_ponto(pontos)</code> que devolve a pontuação com 1 a mais. O corretor vai começar com 0 pontos e chamar a função duas vezes, guardando o resultado.`,
  starter:`def adicionar_ponto(pontos):
    `,
  hint:`return pontos + 1`,
  solution:`def adicionar_ponto(pontos):
    return pontos + 1`,
  require:[{re:/return/, msg:"Devolva o novo valor com return."}],
  tests:[{suffix:`p = 0
p = adicionar_ponto(p)
p = adicionar_ponto(p)
print(p)
print(adicionar_ponto(10))`, expect:`2
11`}] },

{ kind:"lesson", id:"lambda", title:"Funções como valores", eyebrow:"sorted com key e lambda",
  body:`<p>Em Python, uma função também é um valor: dá para passar uma função para outra. O exemplo mais útil é o <code>key</code> do <code>sorted()</code>, que diz <strong>por qual critério</strong> ordenar.</p>
<p><code>lambda</code> cria uma função pequena, de uma linha, sem precisar de <code>def</code>: <code>lambda p: p[1]</code> recebe <code>p</code> e devolve <code>p[1]</code>.</p>`,
  examples:[`palavras = ["melancia", "uva", "kiwi"]
print(sorted(palavras, key=len))

alunos = [("Ana", 8), ("Leo", 6), ("Bia", 9)]
print(sorted(alunos, key=lambda a: a[1]))
print(sorted(alunos, key=lambda a: a[1], reverse=True))`],

{ kind:"lesson", id:"math", title:"Matemática", eyebrow:"Módulo math",
  body:`<p>O módulo <code>math</code> traz constantes e funções matemáticas: <code>math.pi</code>, <code>math.sqrt()</code> (raiz quadrada), <code>math.ceil()</code> (arredonda para cima) e <code>math.floor()</code> (para baixo).</p>

  examples:[`import math

print(sqrt(81))

print(round(2.71828, 2))`],
  task:`Crie <code>area_circulo(raio)</code> que devolve a área (π × raio²) arredondada para 2 casas, e <code>caixas(itens, por_caixa)</code> que devolve quantas caixas são necessárias para guardar todos os itens.`,
  starter:`import math

def area_circulo(raio):


def caixas(itens, por_caixa):

`,
  hint:`round(math.pi * raio ** 2, 2). Para as caixas, sobra item? Arredonde para cima: math.ceil(itens / por_caixa)`,
  solution:`import math

{ kind:"lesson", id:"classes", title:"Classes e objetos", eyebrow:"Criando seus próprios tipos",
  body:`<p>Uma <em>classe</em> é um molde. Um <em>objeto</em> é algo criado a partir desse molde. A classe <code>Produto</code> diz que todo produto tem nome e preço; cada produto real é um objeto com os seus valores.</p>
<p>O método especial <code>__init__</code> roda quando o objeto é criado e guarda os dados nos <em>atributos</em>, usando <code>self</code> (o próprio objeto): <code>self.nome = nome</code>. Nomes de classes começam com letra maiúscula.</p>`,
  examples:[`class Pet:
    def __init__(self, nome, especie):
        self.nome = nome
        self.especie = especie

rex = Pet("Rex", "cachorro")
mia = Pet("Mia", "gato")
print(rex.nome, "é um", rex.especie)
print(mia.nome, "é um", mia.especie)`],
  task:`Complete a classe <code>Produto</code> para que cada produto guarde <code>nome</code> e <code>preco</code> como atributos.`,
  starter:`class Produto:
    def __init__(self, nome, preco):

`,
  hint:`self.nome = nome e self.preco = preco`,
  solution:`class Produto:
    def __init__(self, nome, preco):
        self.nome = nome
        self.preco = preco

caneta = Produto("Caneta", 2.5)
print(caneta.nome, caneta.preco)`,
  tests:[{suffix:`p = Produto("Caneta", 2.5)
print(p.nome, p.preco)
q = Produto("Caderno", 15)
print(q.nome, q.preco)`, expect:`Caneta 2.5
Caderno 15`}] },

{ kind:"lesson", id:"metodos", title:"Métodos", eyebrow:"O que um objeto sabe fazer",
  body:`<p>Além de dados, uma classe tem <em>métodos</em>: funções que pertencem ao objeto e trabalham com os atributos dele. Todo método recebe <code>self</code> como primeiro parâmetro, e você chama com ponto: <code>conta.depositar(100)</code>.</p>
<p>Dados e ações juntos é a ideia central da orientação a objetos.</p>`,
  examples:[`class Lampada:
    def __init__(self):
        self.ligada = False

    def alternar(self):
        self.ligada = not self.ligada

luz = Lampada()
luz.alternar()
print(luz.ligada)
luz.alternar()
print(luz.ligada)`],
  task:`Complete <code>ContaBancaria</code>: <code>depositar(valor)</code> soma ao saldo; <code>sacar(valor)</code> tira do saldo e devolve <code>True</code>, mas, se não houver saldo suficiente, não tira nada e devolve <code>False</code>.`,
  starter:`class ContaBancaria:
    def __init__(self, titular):
        self.titular = titular
        self.saldo = 0

    def depositar(self, valor):


    def sacar(self, valor):

`,
  hint:`depositar: self.saldo += valor. sacar: if valor > self.saldo: return False; self.saldo -= valor; return True`,
  solution:`class ContaBancaria:
    def __init__(self, titular):
        self.titular = titular
        self.saldo = 0

    def depositar(self, valor):

{ kind:"lesson", id:"heranca", title:"Herança", eyebrow:"Classes que herdam de outras",
  body:`<p>Com herança, uma classe nova aproveita tudo de outra e muda só o que for diferente. <code>class Gato(Animal):</code> quer dizer que todo Gato é um Animal: herda atributos e métodos.</p>
<p>Se a classe filha escreve um método com o mesmo nome, ele <em>substitui</em> o da classe mãe. Para chamar a versão da mãe, use <code>super()</code>.</p>`,
  examples:[`class Animal:
    def __init__(self, nome):
        self.nome = nome

    def falar(self):
        return "..."

class Cachorro(Animal):
    def falar(self):
        return "Au au"

class Gato(Animal):
    def falar(self):
        return "Miau"

for bicho in [Cachorro("Rex"), Gato("Mia")]:
    print(bicho.nome, "diz", bicho.falar())`],
  task:`<code>Funcionario</code> já está pronta, com bônus de 10% do salário. Crie <code>Gerente</code>, que herda de <code>Funcionario</code> e tem bônus de 20%.`,
  starter:`class Funcionario:
    def __init__(self, nome, salario):
        self.nome = nome
        self.salario = salario

    def bonus(self):
        return self.salario * 0.1

`,
  hint:`class Gerente(Funcionario): def bonus(self): return self.salario * 0.2`,
  solution:`class Funcionario:
    def __init__(self, nome, salario):
        self.nome = nome
        self.salario = salario

    def bonus(self):
        return self.salario * 0.1

class Gerente(Funcionario):
    def bonus(self):
        return self.salario * 0.2`,
  require:[{re:/class\s+Gerente\s*\(\s*Funcionario\s*\)/, msg:"Crie a classe com class Gerente(Funcionario):"}],
  tests:[{suffix:`f = Funcionario("Ana", 3000)
g = Gerente("Leo", 5000)
print(f.bonus())
print(g.bonus())
print(g.nome, g.salario)`, expect:`300.0
1000.0
Leo 5000`}] },

{ kind:"chal", id:"d-carrinho", title:"Carrinho de compras", level:"Difícil",
  task:`Crie a classe <code>Carrinho</code> com: <code>adicionar(nome, preco, qtd=1)</code>, <code>total()</code> que devolve o valor de tudo e <code>quantidade()</code> que devolve quantas unidades há no carrinho.`,
  tip:`Guarde os itens numa lista dentro do objeto (<code>self.itens = []</code>), cada um como uma tupla <code>(nome, preco, qtd)</code>.`,
  starter:`class Carrinho:
    def __init__(self):
        self.itens = []
`,
  hint:`adicionar: self.itens.append((nome, preco, qtd)). total: some preco * qtd de cada item. quantidade: some qtd.`,
  solution:`class Carrinho:
    def __init__(self):
        self.itens = []

    def adicionar(self, nome, preco, qtd=1):
        self.itens.append((nome, preco, qtd))

    def total(self):
        soma = 0
        for nome, preco, qtd in self.itens:
            soma += preco * qtd
        return soma

    def quantidade(self):
        return sum(qtd for nome, preco, qtd in self.itens)`,
  tests:[{suffix:`c = Carrinho()
print(c.total(), c.quantidade())
c.adicionar("pao", 1.5, 4)
c.adicionar("leite", 4.0)
print(c.total())
print(c.quantidade())`, expect:`0 0
10.0
5`}] },

{ kind:"lesson", id:"forca", title:"Projeto: jogo da forca", eyebrow:"Projeto 3",
  body:`<p>O último projeto junta tudo: sorteio, laços, listas, textos e funções. O computador escolhe uma palavra secreta e você tenta descobrir letra por letra, com 6 chances de errar.</p>
<p>A parte que falta é a que desenha a palavra na tela, mostrando as letras já descobertas e um <code>_</code> no lugar das outras.</p>`,
  examples:[],
  task:`Complete <code>mostrar(palavra, letras)</code>: devolva a palavra com as letras separadas por espaço, trocando por <code>_</code> as que ainda não estão em <code>letras</code>. Exemplo: <code>mostrar("python", ["p", "o"])</code> devolve <code>p _ _ _ o _</code>.`,
  starter:`import random

def mostrar(palavra, letras):


# O jogo (já pronto)
palavra = random.choice(["python", "codigo", "programa", "variavel", "funcao"])
letras = []
erros = 0
while erros < 6:
    print(mostrar(palavra, letras))
    if "_" not in mostrar(palavra, letras):
        print("Você venceu!")
        break
    letra = input("Letra: ").lower()
    if letra in letras:
        print("Essa letra já foi")
    elif letra in palavra:
        letras.append(letra)
    else:
        erros += 1
        print("Errou! Chances restantes:", 6 - erros)
if erros == 6:
    print("Fim de jogo. A palavra era", palavra)
`,
  hint:`Monte uma lista: para cada letra da palavra, use a letra se ela estiver em letras, senão "_". Depois " ".join(lista).`,
  solution:`import random

def mostrar(palavra, letras):
    partes = []
    for l in palavra:
        if l in letras:
            partes.append(l)
        else:
            partes.append("_")
    return " ".join(partes)

palavra = random.choice(["python", "codigo", "programa", "variavel", "funcao"])
letras = []
erros = 0
while erros < 6:
    print(mostrar(palavra, letras))
    if "_" not in mostrar(palavra, letras):
        print("Você venceu!")
        break
    letra = input("Letra: ").lower()
    if letra in letras:
        print("Essa letra já foi")
    elif letra in palavra:
        letras.append(letra)
    else:
        erros += 1
        print("Errou! Chances restantes:", 6 - erros)
if erros == 6:
    print("Fim de jogo. A palavra era", palavra)`,
  tests:[{inputs:"aeioucdfgnlprtvhymbkjqswxz".split(""), suffix:`print(mostrar("python", ["p", "o"]))
print(mostrar("ana", []))
print(mostrar("ana", ["a", "n"]))`, expect:`p _ _ _ o _
_ _ _
